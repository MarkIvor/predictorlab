[project]
name = "predictorlab-mcp"
version = "0.3.0"
description = "MCP-сервер PredictorLab: прогнозы, причины, what-if, контрфактуалы, Model Card, дрейф"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=1.28,<2", "httpx>=0.27", "uvicorn>=0.30", "starlette>=0.40"]

[project.scripts]
predictorlab-mcp = "predictorlab_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
