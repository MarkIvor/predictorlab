name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout hypothesis requests ruff mypy bandit

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Lint (ruff)
        run: python -m ruff check backend tests tools bench mcp/src demo-data

      - name: Format check (ruff)
        run: python -m ruff format --check backend tests tools bench mcp/src demo-data

      - name: Typecheck (mypy)
        run: python -m mypy backend/app

      - name: Frontend lint (eslint)
        working-directory: frontend
        run: npx eslint src --max-warnings 50

      - name: Frontend typecheck (tsc)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Property tests
        run: python -m pytest tests/property -q

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: LLM contract tests
        run: python -m pytest tests/llm -q

      - name: Security tests
        run: python -m pytest tests/security -q

      - name: Coverage (all test groups combined)
        run: |
          python -m pytest tests/unit tests/property tests/integration tests/llm tests/security \
            -q --cov=backend/app/core --cov-report=term --cov-fail-under=60

      - name: Frontend tests (vitest)
        working-directory: frontend
        run: npm test
