name: Nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout hypothesis requests ruff mypy playwright
          playwright install chromium --with-deps
          (cd frontend && npm install --legacy-peer-deps && npm run build)

      - name: Benchmarks
        run: python -u bench/run.py
        continue-on-error: true

      - name: ML quality tests
        run: python -m pytest tests/ml -q --timeout=900
        continue-on-error: true

      - name: E2E full scenario
        run: python tests/e2e/e2e_full.py --with-server
        continue-on-error: true

      - name: E2E acceptance
        run: python tests/e2e/e2e_acceptance.py --with-server
        continue-on-error: true
