name: Nightly
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout hypothesis requests ruff mypy

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Benchmarks
        run: python -u bench/run.py
        continue-on-error: true

      - name: ML quality tests
        run: python -m pytest tests/ml -q --timeout=900
        continue-on-error: true
