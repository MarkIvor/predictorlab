services:
  backend:
    build: ./backend
    container_name: predictorlab-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - pl_storage:/app/storage
      - pl_data:/app/data
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: predictorlab-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pl_storage:
  pl_data:
