[project]
name = "predictorlab"
version = "0.3.0"
description = "Self-hosted tabular ML: honest models, conformal intervals, profit-driven thresholds, REST API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ivor's Lab" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.0",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "duckdb>=1.0",
  "pandas>=2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "lightgbm>=4",
  "optuna>=3.6",
  "shap>=0.45",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "charset-normalizer>=3",
  "sqlglot>=23",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "cryptography>=42",
  "httpx>=0.27",
  "pyyaml>=6",
  "prometheus-client>=0.20",
  "fpdf2>=2.7",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=6", "pytest-timeout>=2.3",
  "hypothesis>=6", "requests>=2.31", "ruff>=0.17", "mypy>=2.4",
  "bandit>=1.8", "pip-audit>=2.7", "pre-commit>=4",
  "playwright>=1.50",
]
tabpfn = ["tabpfn>=2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend", "mcp/src"]
testpaths = ["tests"]
markers = [
  "unit: детерминированные юнит-тесты",
  "property: property-based (hypothesis)",
  "integration: API через TestClient на реальных DuckDB/SQLite",
  "ml: обучение на золотых датасетах и инварианты модели",
  "llm: контракт LLM-части на мок-клиенте и фикстурах",
  "security: безопасность: ключи, доступ, ПДн в логах",
  "e2e: сквозные сценарии (Playwright)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".venv", "frontend/node_modules", "storage", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: длинные строки SQL допустимы; B008: паттерн FastAPI Depends в дефолтных аргументах
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/e2e/*" = ["E402"]
"bench/*" = ["E402"]
"demo-data/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["(?x)(^backend/app/core/(training|predict)/.*$)"]

[[tool.mypy.overrides]]
module = ["app.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["app.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["backend/app/core"]
omit = ["*/__init__.py"]

[tool.coverage.report]
precision = 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
