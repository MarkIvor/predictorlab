[project]
name = "predictorlab"
version = "0.3.0"
description = "Self-hosted tabular ML: honest models, conformal intervals, profit-driven thresholds, REST API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ivor's Lab" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.0",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "duckdb>=1.0",
  "pandas>=2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "lightgbm>=4",
  "optuna>=3.6",
  "shap>=0.45",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "charset-normalizer>=3",
  "sqlglot>=23",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "cryptography>=42",
  "httpx>=0.27",
  "pyyaml>=6",
  "prometheus-client>=0.20",
  "fpdf2>=2.7",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "requests>=2.31", "hypothesis>=6"]
tabpfn = ["tabpfn>=2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend", "mcp/src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
